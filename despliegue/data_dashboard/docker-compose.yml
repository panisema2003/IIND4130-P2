version: "3.9"

services:
  dashboard:
    build: .
    image: icfes-dashboard:latest
    container_name: icfes-dashboard
    ports:
      - "8050:8050"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
